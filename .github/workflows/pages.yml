name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate app JavaScript
        run: |
          node --check app.js
          node --check app-reliability.js
          node --check smart-pumping.js
          node --check pump-home-controls.js
          node --check pump-insights.js
          node --check ai-coach-client.js
          node --check app-update-notice.js
          node --check family-chat.js
          node --check functions/index.js
          node --check functions/index-entry.js
          node --check functions/family-chat.js
          node --check functions/pump-context.js
      - name: Verify production files
        run: |
          test -f index.html
          test -f app.js
          test -f app-reliability.js
          test -f smart-pumping.js
          test -f pump-home-controls.js
          test -f pump-insights.js
          test -f ai-coach-client.js
          test -f app-update-notice.js
          test -f family-chat.js
          test -f functions/index.js
          test -f functions/index-entry.js
          test -f functions/family-chat.js
          test -f functions/pump-context.js
          test -f functions/package.json
          test -f styles.css
          test -f config.js
          grep -q 'app.js' index.html
          grep -q 'app-reliability.js' index.html
          grep -q 'smart-pumping.js' index.html
          grep -q 'pump-home-controls.js' index.html
          grep -q 'pump-insights.js' index.html
          grep -q 'ai-coach-client.js' index.html
          grep -q 'app-update-notice.js' index.html
          grep -q 'family-chat.js' index.html
          grep -q 'styles.css' index.html
          ! grep -q 'app-v7.js' index.html
          ! grep -q 'data-migration-v7.js' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
