name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate production JavaScript
        run: |
          node --check stable34-bridge.js
          node --check app.js
          node --check app-reliability.js
          node --check core-ui.js
          node --check ai-coach-client.js
          node --check app-update-notice.js
          node --check family-chat.js
          node --check functions/index.js
          node --check functions/index-entry.js
          node --check functions/family-chat.js
          node --check functions/pump-context.js
      - name: Verify canonical production surface
        run: |
          test -f index.html
          test -f stable34-bridge.js
          test -f app.js
          test -f app-reliability.js
          test -f core-ui.js
          test -f ai-coach-client.js
          test -f app-update-notice.js
          test -f family-chat.js
          test -f styles.css
          test -f config.js
          test -f firebase.json
          test -f .firebaserc
          grep -q 'stable34-bridge.js?build=stable34r8' index.html
          grep -q 'app.js?build=stable34r8' index.html
          grep -q 'core-ui.js?build=stable34r8' index.html
          grep -q 'family-chat.js?build=stable34r8' index.html
          grep -q 'manifest.webmanifest?build=stable34r8' index.html
          grep -q "milkflow-stable34r8" sw.js
          grep -q 'familyChatEndpoints' config.js
          grep -q 'correctedPlan' stable34-bridge.js
          grep -q 'mf-r2-highlights{display:none' stable34-bridge.js
          grep -q 'body\[data-screen="mom-home"\].*main' stable34-bridge.js
          grep -q 'body\[data-screen="baby-home"\].*main' stable34-bridge.js
          grep -q 'mf-top-orbs' core-ui.js
          grep -q 'mf-mom-orbs' core-ui.js
          grep -q 'mf-mom-hero-photo' core-ui.js
          grep -q 'mf-last-feed-band' core-ui.js
          grep -q 'mf-last-feed-age' core-ui.js
          grep -q ':root\[data-theme="dark"\] .mf-top-orb' core-ui.js
          grep -q 'relativeAgo' core-ui.js
          grep -q 'lastFeedText' core-ui.js
          grep -q "'Pumps','mom-pumps'" core-ui.js
          grep -q "'Vs avg','baby-usual'" core-ui.js
          grep -q 'mf-feed-card milk' core-ui.js
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' core-ui.js
          grep -q 'min-width:30px;height:30px' core-ui.js
          grep -q 'milkflow:base-rendered' core-ui.js
          grep -q 'data-feed-type="expressed_milk"' core-ui.js
          grep -q 'mf-diaper-cluster' core-ui.js
          grep -q 'data-sleep' core-ui.js
          grep -q 'data-growth' core-ui.js
          ! grep -q 'chat-reliability.js' index.html
          ! grep -q 'runtime-stability.js' index.html
          ! grep -q 'smart-pumping.js' index.html
          ! grep -q 'pump-home-controls.js' index.html
          ! grep -q 'adaptive-pump-plan.js' index.html
          ! grep -q 'pump-insights.js' index.html
          ! grep -q 'modern-stickers.js' index.html
          ! grep -q 'baby-home-modern.js' index.html
          ! grep -q 'mom-profile.js' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
