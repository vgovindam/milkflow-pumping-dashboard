name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate production JavaScript
        run: |
          node --check app.js
          node --check app-reliability.js
          node --check core-ui.js
          node --check ai-coach-client.js
          node --check app-update-notice.js
          node --check family-chat.js
          node --check functions/index.js
          node --check functions/index-entry.js
          node --check functions/family-chat.js
          node --check functions/pump-context.js
          node scripts/ui-audit.mjs
      - name: Verify canonical production surface
        run: |
          test -f index.html
          test -f app.js
          test -f app-reliability.js
          test -f core-ui.js
          test -f ai-coach-client.js
          test -f app-update-notice.js
          test -f family-chat.js
          test -f styles.css
          test -f config.js
          test -f firebase.json
          test -f .firebaserc
          grep -q 'styles.css?build=stable46' index.html
          grep -q 'app.js?build=stable46' index.html
          grep -q 'core-ui.js?build=stable46' index.html
          grep -q 'family-chat.js?build=stable46' index.html
          grep -q 'manifest.webmanifest?build=stable46' index.html
          grep -q "milkflow-stable46" sw.js
          grep -q 'familyChatEndpoints' config.js
          ! grep -q 'stable34-bridge.js' index.html
          grep -q 'milkflow:base-rendered' app.js
          grep -q 'aria-label="Mom dashboard"' core-ui.js
          grep -q 'aria-label="Baby dashboard"' core-ui.js
          grep -q 'data-mf-target="5"' core-ui.js
          grep -q 'data-mf-target="6"' core-ui.js
          grep -q 'function openPlanDialog' core-ui.js
          grep -q 'mf-x-feed-grid' core-ui.js
          grep -q 'mf-x-diapers' core-ui.js
          grep -q 'mf-x-list' core-ui.js
          grep -q 'function animalSticker' core-ui.js
          grep -q 'function decorateApp' core-ui.js
          grep -q 'data-realm="mom"' core-ui.js
          grep -q "momTab.textContent=S.profile.momName||'Mom'" app.js
          grep -q 'padding:14px 13px calc(112px' styles.css
          grep -q 'body:not(\[data-screen\^="mom-"\]) #mfChatButton' core-ui.js
          grep -q 'milkflow:base-rendered' core-ui.js
          grep -q 'data-feed-type="expressed_milk"' core-ui.js
          grep -q 'data-sleep' core-ui.js
          grep -q 'data-growth' core-ui.js
          grep -q 'for(const url of urls)' family-chat.js
          grep -q '<strong>Pump coach</strong>' family-chat.js
          ! grep -q 'chat-reliability.js' index.html
          ! grep -q 'runtime-stability.js' index.html
          ! grep -q 'smart-pumping.js' index.html
          ! grep -q 'pump-home-controls.js' index.html
          ! grep -q 'adaptive-pump-plan.js' index.html
          ! grep -q 'pump-insights.js' index.html
          ! grep -q 'modern-stickers.js' index.html
          ! grep -q 'baby-home-modern.js' index.html
          ! grep -q 'mom-profile.js' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
