name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production JavaScript and rendered routes
        run: |
          node --check app.js
          node --check app-reliability.js
          node --check core-ui.js
          node --check experience-theme.js
          node --check render-lifecycle.js
          node --check plan-reliability.js
          node --check network-reliability.js
          node --check ai-coach-client.js
          node --check app-update-notice.js
          node --check family-chat.js
          node --check doctor-summary.js
          node --check functions/index.js
          node --check functions/index-entry.js
          node --check functions/family-chat.js
          node --check functions/pump-context.js
          node --check scripts/browser-visual-audit.mjs
          node scripts/ui-audit.mjs
          node scripts/interaction-audit.mjs
          node scripts/browser-visual-audit.mjs

      - name: Upload rendered QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milkflow-visual-audit-${{ github.run_number }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Verify canonical production surface
        run: |
          test -f index.html
          test -f app.js
          test -f app-reliability.js
          test -f core-ui.js
          test -f experience-theme.js
          test -f render-lifecycle.js
          test -f plan-reliability.js
          test -f network-reliability.js
          test -f ai-coach-client.js
          test -f app-update-notice.js
          test -f family-chat.js
          test -f doctor-summary.js
          test -f styles.css
          test -f component-theme.css
          test -f component-theme-core.css
          test -f experience-themes.css
          test -f doctor-summary.css
          test -f assets/themes/cloud-island.svg
          test -f assets/themes/forest-clearing.svg
          test -f assets/animals/bear.svg
          test -f assets/animals/rabbit.svg
          test -f assets/animals/fox.svg
          test -f assets/animals/owl.svg
          test -f assets/animals/beaver.svg
          test -f scripts/interaction-audit.mjs
          test -f scripts/browser-visual-audit.mjs
          test -f config.js
          test -f firebase.json
          test -f .firebaserc

          grep -q 'styles.css?build=stable45-human10' index.html
          grep -q 'component-theme.css?build=stable45-human10' index.html
          grep -q 'doctor-summary.css?build=stable45-human10' index.html
          grep -q 'app.js?build=stable45-human10' index.html
          grep -q 'core-ui.js?build=stable45-human10' index.html
          grep -q 'experience-theme.js?build=stable45-human10' index.html
          grep -q 'render-lifecycle.js?build=stable45-human10' index.html
          grep -q 'plan-reliability.js?build=stable45-human10' index.html
          grep -q 'network-reliability.js?build=stable45-human10' index.html
          grep -q 'family-chat.js?build=stable45-human10' index.html
          grep -q 'doctor-summary.js?build=stable45-human10' index.html
          grep -q 'manifest.webmanifest?build=stable45-human10' index.html
          grep -q 'milkflow-stable45-human10' sw.js
          grep -q 'doctor-summary.css' sw.js
          grep -q 'doctor-summary.js' sw.js
          grep -q 'experience-themes.css' sw.js
          grep -q 'assets/themes/cloud-island.svg' sw.js
          grep -q 'assets/themes/forest-clearing.svg' sw.js

          grep -q "STATE_KEY = 'milkflow-family-v4-state'" app.js
          grep -q "const STATE_KEY='milkflow-family-v4-state'" core-ui.js
          grep -q 'function unionById' app.js
          grep -q 'correctedPlan' plan-reliability.js
          grep -q 'familyChatEndpoints' network-reliability.js
          grep -q "new MutationObserver(publish).observe(view,{childList:true})" render-lifecycle.js
          grep -q 'function resetRouteScroll' render-lifecycle.js
          grep -q 'function exactRouteControl' render-lifecycle.js
          grep -q 'sessionStorage.setItem(retryKey' render-lifecycle.js
          grep -q 'mf-render-recovery' render-lifecycle.js
          ! grep -q 'subtree:true' render-lifecycle.js
          ! grep -q 'MutationObserver' app-reliability.js
          ! grep -q "Object.defineProperty(Element.prototype,'innerHTML'" *.js

          grep -q '@layer milkflow-core, milkflow-experience, milkflow-controls, milkflow-selection' component-theme.css
          grep -q 'display:grid!important;position:fixed!important;z-index:70!important' component-theme.css
          grep -q 'bottom-nav svg.ico' component-theme.css
          grep -q 'sheet-actions button\[data-diaper="wet"\]' component-theme.css
          grep -q '#diaperDialog:not(.is-edit)' component-theme.css
          grep -q 'choice-row button.on::after' component-theme.css
          grep -q 'field input' component-theme.css

          grep -q 'milkflow-experience-theme-v1' experience-theme.js
          grep -q 'data-experience-theme-pick="storybook"' experience-theme.js
          grep -q 'Cloud Island for Mom' experience-theme.js
          grep -q 'Woodland Forest for Baby' experience-theme.js
          grep -q 'decorateThemeArtwork' experience-theme.js
          grep -q 'mf-storybook-animal' experience-theme.js
          ! grep -q 'MutationObserver' experience-theme.js

          grep -q 'cloud-island.svg' experience-themes.css
          grep -q 'forest-clearing.svg' experience-themes.css
          grep -q 'mf-animal-sticker.has-storybook-art>svg' experience-themes.css
          grep -q 'mf-storybook-animal' experience-themes.css
          grep -q 'mf-last-feed-band + .mf-care-label' experience-themes.css
          grep -q 'mf-feed-zone + .mf-care-label' experience-themes.css
          grep -q 'PUMPING' experience-themes.css
          grep -q 'NURSING' experience-themes.css
          grep -q 'background:#1c2030!important;border-color:#353b50!important;color:#f6f8fd!important' experience-themes.css
          grep -q 'mf-dream-journey' experience-themes.css
          ! grep -q 'body\[data-realm="family"\] .main' experience-themes.css

          grep -q 'mf-doctor-print' doctor-summary.css
          grep -q 'Clinical snapshot' doctor-summary.js
          grep -q 'Daily care log' doctor-summary.js
          grep -q 'beforeprint' doctor-summary.js
          grep -q 'body\[data-screen="doctor"\]' doctor-summary.css

          grep -q 'overflow-y:auto!important' component-theme-core.css
          grep -q 'bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px))' component-theme-core.css
          grep -q 'padding-bottom:calc(132px + env(safe-area-inset-bottom))' component-theme-core.css
          grep -q 'sync-foot.synced' component-theme-core.css
          grep -q 'daily-cell.wet' component-theme-core.css
          grep -q 'metric:nth-child(1)' component-theme-core.css
          grep -q 'mf-top-orbs' core-ui.js
          grep -q 'mf-mom-hero-photo' core-ui.js
          grep -q 'mf-last-feed-band' core-ui.js
          grep -q 'mf-dream-hero' core-ui.js
          grep -q 'mf-dream-journey' core-ui.js
          grep -q 'function animalSticker' core-ui.js
          grep -q 'mf-animal-hero' core-ui.js
          grep -q "momTab.textContent=S.profile.momName||'Mom'" app.js
          grep -q 'data-feed-type="expressed_milk"' core-ui.js
          grep -q 'mf-diaper-cluster' core-ui.js
          grep -q 'data-sleep' core-ui.js
          grep -q 'data-growth' core-ui.js

          ! grep -q 'stable34-bridge.js' index.html
          ! grep -q 'baby-experience.js' index.html
          ! grep -q 'care-polish.css' index.html
          ! grep -q 'layout-fixes.css' index.html
          ! grep -q 'baby-compact.css' index.html
          ! grep -q 'dark-contrast.css' index.html
          ! grep -q 'chat-reliability.js' index.html
          ! grep -q 'runtime-stability.js' index.html
          ! grep -q 'smart-pumping.js' index.html
          ! grep -q 'pump-home-controls.js' index.html
          ! grep -q 'adaptive-pump-plan.js' index.html
          ! grep -q 'pump-insights.js' index.html
          ! grep -q 'modern-stickers.js' index.html
          ! grep -q 'baby-home-modern.js' index.html
          ! grep -q 'mom-profile.js' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4