name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production JavaScript and rendered routes
        run: |
          node --check app.js
          node --check app-reliability.js
          node --check core-ui.js
          node --check experience-theme.js
          node --check doctor-summary.js
          node --check render-lifecycle.js
          node --check plan-reliability.js
          node --check network-reliability.js
          node --check ai-coach-client.js
          node --check app-update-notice.js
          node --check family-chat.js
          node --check functions/index.js
          node --check functions/index-entry.js
          node --check functions/family-chat.js
          node --check functions/pump-context.js
          node --check scripts/browser-visual-audit.mjs
          node scripts/ui-audit.mjs
          node scripts/interaction-audit.mjs
          node scripts/browser-visual-audit.mjs

      - name: Upload rendered QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milkflow-visual-audit-${{ github.run_number }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Verify canonical production surface
        run: |
          for f in index.html app.js app-reliability.js core-ui.js experience-theme.js doctor-summary.js render-lifecycle.js plan-reliability.js network-reliability.js ai-coach-client.js app-update-notice.js family-chat.js styles.css component-theme.css component-theme-core.css experience-themes.css jungle-theme.css doctor-summary.css config.js firebase.json .firebaserc; do test -f "$f"; done
          for f in assets/themes/cloud-island.svg assets/themes/forest-clearing.svg assets/themes/jungle-canopy.svg assets/animals/bear.svg assets/animals/rabbit.svg assets/animals/fox.svg assets/animals/owl.svg assets/animals/beaver.svg assets/animals/elephant.svg assets/animals/monkey.svg assets/animals/tiger.svg assets/animals/parrot.svg assets/animals/hippo.svg scripts/interaction-audit.mjs scripts/browser-visual-audit.mjs; do test -f "$f"; done

          grep -q 'styles.css?build=stable45-human11' index.html
          grep -q 'component-theme.css?build=stable45-human11' index.html
          grep -q 'jungle-theme.css?build=stable45-human11' index.html
          grep -q 'doctor-summary.css?build=stable45-human11' index.html
          grep -q 'app.js?build=stable45-human11' index.html
          grep -q 'experience-theme.js?build=stable45-human11' index.html
          grep -q 'doctor-summary.js?build=stable45-human11' index.html
          grep -q 'manifest.webmanifest?build=stable45-human11' index.html
          grep -q 'milkflow-stable45-human11' sw.js
          grep -q 'jungle-theme.css' sw.js
          grep -q 'assets/themes/jungle-canopy.svg' sw.js
          grep -q 'assets/animals/elephant.svg' sw.js
          grep -q 'assets/animals/monkey.svg' sw.js
          grep -q 'assets/animals/tiger.svg' sw.js
          grep -q 'assets/animals/parrot.svg' sw.js
          grep -q 'assets/animals/hippo.svg' sw.js

          grep -q "STATE_KEY = 'milkflow-family-v4-state'" app.js
          grep -q "const STATE_KEY='milkflow-family-v4-state'" core-ui.js
          grep -q 'function unionById' app.js
          grep -q 'correctedPlan' plan-reliability.js
          grep -q 'familyChatEndpoints' network-reliability.js
          grep -q "new MutationObserver(publish).observe(view,{childList:true})" render-lifecycle.js
          grep -q 'function resetRouteScroll' render-lifecycle.js
          grep -q 'mf-render-recovery' render-lifecycle.js
          ! grep -q 'subtree:true' render-lifecycle.js
          ! grep -q 'MutationObserver' app-reliability.js
          ! grep -q "Object.defineProperty(Element.prototype,'innerHTML'" *.js

          grep -q '@layer milkflow-core, milkflow-experience, milkflow-controls, milkflow-selection' component-theme.css
          grep -q 'display:grid!important;position:fixed!important;z-index:70!important' component-theme.css
          grep -q 'bottom-nav svg.ico' component-theme.css
          grep -q '#diaperDialog:not(.is-edit)' component-theme.css
          grep -q 'choice-row button.on::after' component-theme.css

          grep -q "new Set(\['storybook','jungle','clean'\])" experience-theme.js
          grep -q 'data-experience-theme-pick="storybook"' experience-theme.js
          grep -q 'data-experience-theme-pick="jungle"' experience-theme.js
          grep -q 'data-experience-theme-pick="clean"' experience-theme.js
          grep -q 'Jungle Canopy for Baby' experience-theme.js
          grep -q 'mf-theme-animal' experience-theme.js
          ! grep -q 'MutationObserver' experience-theme.js

          grep -q 'cloud-island.svg' experience-themes.css
          grep -q 'forest-clearing.svg' experience-themes.css
          grep -q 'jungle-canopy.svg' jungle-theme.css
          grep -q 'data-experience-theme="jungle"' jungle-theme.css
          grep -q 'has-jungle-art>.mf-theme-animal' jungle-theme.css
          grep -q 'content:"DIAPERS · "' jungle-theme.css
          ! grep -q 'body\[data-realm="family"\] .main' experience-themes.css
          ! grep -q 'body\[data-realm="family"\] .main' jungle-theme.css
          ! grep -q 'bottom-nav' jungle-theme.css

          grep -q 'mf-doctor-print' doctor-summary.js
          grep -q 'mf-print-table' doctor-summary.js
          grep -q 'Clinical snapshot' doctor-summary.js
          grep -q 'Daily care log' doctor-summary.js
          grep -q 'prepareDoctorPrint' doctor-summary.js
          grep -q '@media print' doctor-summary.css

          ! grep -q 'care-polish.css' index.html
          ! grep -q 'layout-fixes.css' index.html
          ! grep -q 'baby-compact.css' index.html
          ! grep -q 'dark-contrast.css' index.html
          ! grep -q 'runtime-stability.js' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
