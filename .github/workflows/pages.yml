name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production JavaScript and rendered routes
        run: |
          node --check app.js
          node --check app-reliability.js
          node --check cross-device-alerts.js
          node --check core-ui.js
          node --check experience-theme-v2.js
          node --check doctor-summary.js
          node --check render-lifecycle.js
          node --check plan-reliability.js
          node --check network-reliability.js
          node --check ai-coach-client.js
          node --check app-update-notice.js
          node --check family-chat.js
          node --check sw.js
          node --check functions/index.js
          node --check functions/index-entry.js
          node --check functions/family-chat.js
          node --check functions/pump-context.js
          node --check functions/cross-device-alerts.js
          node --check scripts/browser-visual-audit.mjs
          node scripts/ui-audit.mjs
          node scripts/interaction-audit.mjs
          node scripts/browser-visual-audit.mjs

      - name: Upload rendered QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milkflow-visual-audit-${{ github.run_number }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Verify canonical production surface
        run: |
          for f in index.html app.js app-reliability.js cross-device-alerts.js core-ui.js experience-theme-v2.js doctor-summary.js render-lifecycle.js plan-reliability.js network-reliability.js ai-coach-client.js app-update-notice.js family-chat.js styles.css component-theme.css component-theme-core.css experience-themes.css experience-art-v2.css doctor-summary.css config.js firebase.json .firebaserc sw.js functions/cross-device-alerts.js; do test -f "$f"; done
          for f in assets/themes/safari-adventure.svg assets/themes/butterfly-garden.svg assets/themes/princess-palace.svg assets/themes/unicorn-dreams.svg assets/themes/care-milk.svg assets/themes/care-nurse.svg assets/themes/care-formula.svg assets/themes/care-wet.svg assets/themes/care-poop.svg assets/themes/care-mixed.svg assets/animals/elephant.svg assets/animals/monkey.svg assets/animals/tiger.svg assets/animals/parrot.svg assets/animals/hippo.svg scripts/interaction-audit.mjs scripts/browser-visual-audit.mjs; do test -f "$f"; done

          grep -q 'styles.css?build=stable45-human14' index.html
          grep -q 'component-theme.css?build=stable45-human14' index.html
          grep -q 'experience-art-v2.css?build=stable45-human14' index.html
          grep -q 'doctor-summary.css?build=stable45-human14' index.html
          grep -q 'app.js?build=stable45-human14' index.html
          grep -q 'experience-theme-v2.js?build=stable45-human14' index.html
          grep -q 'doctor-summary.js?build=stable45-human14' index.html
          grep -q 'manifest.webmanifest?build=stable45-human14' index.html
          ! grep -q 'jungle-theme.css?build=' index.html
          ! grep -q 'experience-theme.js?build=' index.html

          grep -q 'milkflow-stable45-human14' sw.js
          grep -q 'cross-device-alerts.js' sw.js
          grep -q 'firebase-messaging-compat.js' sw.js
          grep -q 'onBackgroundMessage' sw.js
          grep -q 'notificationclick' sw.js
          grep -q 'experience-art-v2.css' sw.js
          grep -q 'experience-theme-v2.js' sw.js
          grep -q 'assets/themes/safari-adventure.svg' sw.js
          grep -q 'assets/themes/butterfly-garden.svg' sw.js
          grep -q 'assets/themes/princess-palace.svg' sw.js
          grep -q 'assets/themes/unicorn-dreams.svg' sw.js
          grep -q 'assets/themes/care-milk.svg' sw.js
          grep -q 'assets/themes/care-wet.svg' sw.js
          grep -q 'assets/themes/care-mixed.svg' sw.js

          grep -q "STATE_KEY = 'milkflow-family-v4-state'" app.js
          grep -q "const STATE_KEY='milkflow-family-v4-state'" core-ui.js
          grep -q 'function unionById' app.js
          grep -q 'correctedPlan' plan-reliability.js
          grep -q 'familyChatEndpoints' network-reliability.js
          grep -q "new MutationObserver(publish).observe(view,{childList:true})" render-lifecycle.js
          grep -q 'function resetRouteScroll' render-lifecycle.js
          grep -q 'mf-render-recovery' render-lifecycle.js
          ! grep -q 'subtree:true' render-lifecycle.js
          ! grep -q 'MutationObserver' app-reliability.js
          ! grep -q "Object.defineProperty(Element.prototype,'innerHTML'" *.js

          grep -q 'cross-device-alerts.js?build=stable45-human13' app-reliability.js
          grep -q 'milkflow-device-id-v1' cross-device-alerts.js
          grep -q 'sourceDeviceId' cross-device-alerts.js
          grep -q 'data-cross-device-alert-toggle' cross-device-alerts.js
          grep -q "watchCollection('entries')" cross-device-alerts.js
          grep -q "watchCollection('familyEvents')" cross-device-alerts.js
          grep -q 'getToken(options)' cross-device-alerts.js
          grep -q "collection('devices')" cross-device-alerts.js

          grep -q 'onDocumentCreated' functions/cross-device-alerts.js
          grep -q 'notifyMomEntry' functions/cross-device-alerts.js
          grep -q 'notifyBabyEvent' functions/cross-device-alerts.js
          grep -q 'sourceDeviceId' functions/cross-device-alerts.js
          grep -q "collection('devices')" functions/cross-device-alerts.js
          grep -q 'sendEachForMulticast' functions/cross-device-alerts.js
          grep -q 'createCrossDeviceAlertFunctions' functions/index-entry.js

          grep -q '@layer milkflow-core, milkflow-experience, milkflow-controls, milkflow-selection' component-theme.css
          grep -q 'display:grid!important;position:fixed!important;z-index:70!important' component-theme.css
          grep -q 'bottom-nav svg.ico' component-theme.css
          grep -q '#diaperDialog:not(.is-edit)' component-theme.css
          grep -q 'choice-row button.on::after' component-theme.css

          grep -Fq "new Set(['safari','butterfly','princess','unicorn','clean'])" experience-theme-v2.js
          grep -q "value==='jungle'||value==='storybook'" experience-theme-v2.js
          grep -q "themeCard('safari','Safari Adventure'" experience-theme-v2.js
          grep -q "themeCard('butterfly','Butterfly Garden'" experience-theme-v2.js
          grep -q "themeCard('princess','Princess Palace'" experience-theme-v2.js
          grep -q "themeCard('unicorn','Unicorn Dreams'" experience-theme-v2.js
          grep -q 'mf-theme-animal' experience-theme-v2.js
          ! grep -q 'MutationObserver' experience-theme-v2.js

          grep -q 'safari-adventure.svg' experience-art-v2.css
          grep -q 'butterfly-garden.svg' experience-art-v2.css
          grep -q 'princess-palace.svg' experience-art-v2.css
          grep -q 'unicorn-dreams.svg' experience-art-v2.css
          grep -q 'care-milk.svg' experience-art-v2.css
          grep -q 'care-wet.svg' experience-art-v2.css
          grep -q 'care-poop.svg' experience-art-v2.css
          grep -q 'care-mixed.svg' experience-art-v2.css
          grep -q 'padding-bottom:calc(174px + env(safe-area-inset-bottom))' experience-art-v2.css
          ! grep -q '.bottom-nav svg{display:none' experience-art-v2.css

          grep -q 'mf-doctor-print' doctor-summary.js
          grep -q 'mf-print-table' doctor-summary.js
          grep -q 'Clinical snapshot' doctor-summary.js
          grep -q 'Daily care log' doctor-summary.js
          grep -q 'prepareDoctorPrint' doctor-summary.js
          grep -q '@media print' doctor-summary.css

          ! grep -q 'care-polish.css' index.html
          ! grep -q 'layout-fixes.css' index.html
          ! grep -q 'baby-compact.css' index.html
          ! grep -q 'dark-contrast.css' index.html
          ! grep -q 'runtime-stability.js' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
