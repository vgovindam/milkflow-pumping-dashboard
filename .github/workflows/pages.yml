name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate app JavaScript
        run: node --check app.js
      - name: Verify production files
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f config.js
          grep -q 'app.js' index.html
          grep -q 'styles.css' index.html
          ! grep -q 'app-v7.js' index.html
          ! grep -q 'data-migration-v7.js' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
