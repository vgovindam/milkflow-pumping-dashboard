name: Deploy MilkFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install release tooling
        run: npm ci

      - name: CSS architecture audit
        run: npm run lint

      - name: Functional and data-contract tests
        run: npm run test

      - name: Build production and render visual QA
        run: npm run qa

      - name: Verify exact production artifact
        run: npm run production:audit

      - name: Upload rendered QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milkflow-visual-audit-${{ github.run_number }}
          path: visual-audit
          if-no-files-found: warn
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload production dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
