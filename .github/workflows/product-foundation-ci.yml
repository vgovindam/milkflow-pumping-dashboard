name: Product Foundation CI

on:
  push:
    branches:
      - next/product-foundation-v2-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: CSS architecture audit
        run: npm run lint

      - name: Functional and data-contract tests
        run: npm run test

      - name: Build and visual QA
        run: npm run qa

      - name: Verify production artifact
        run: npm run production:audit

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-foundation-visual-audit
          path: visual-audit
          if-no-files-found: warn
          retention-days: 3
