  <stop offset="0.667" stop-color="#171432"/>
  <stop offset="1" stop-color="#0D0C1E"/>
</linearGradient>
<filter id="soften" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
<radialGradient id="vig" cx=".5" cy=".42"><stop offset=".55" stop-color="#04040C" stop-opacity="0"/><stop offset="1" stop-color="#04040C" stop-opacity=".5"/></radialGradient>
<radialGradient id="L0"><stop stop-color="#5B4BD6" stop-opacity="0.85"/><stop offset="1" stop-color="#5B4BD6" stop-opacity="0"/></radialGradient>
<radialGradient id="L1"><stop stop-color="#8A5BD8" stop-opacity="0.85"/><stop offset="1" stop-color="#8A5BD8" stop-opacity="0"/></radialGradient>
<radialGradient id="L2"><stop stop-color="#3D5FC4" stop-opacity="0.85"/><stop offset="1" stop-color="#3D5FC4" stop-opacity="0"/></radialGradient>
<radialGradient id="L3"><stop stop-color="#6E4FC8" stop-opacity="0.85"/><stop offset="1" stop-color="#6E4FC8" stop-opacity="0"/></radialGradient>
<linearGradient id="S0" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="1120" y2="0">
