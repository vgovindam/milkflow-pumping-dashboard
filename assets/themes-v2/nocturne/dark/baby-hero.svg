<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" preserveAspectRatio="xMidYMid slice" role="img" aria-label="nocturne dark baby hero background">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
