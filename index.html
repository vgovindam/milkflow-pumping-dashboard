<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f6fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent lets the web view extend under the status bar so the artwork reaches
       the physical top edge; the top bar already pads itself by env(safe-area-inset-top). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="MilkFlow">
  <meta name="apple-mobile-web-app-title" content="MilkFlow">
  <title>MilkFlow Family</title>
  <link rel="manifest" href="manifest.webmanifest?v=__MILKFLOW_VERSION__">
  <link rel="icon" href="milkflow-family-v3-192.png?v=__MILKFLOW_VERSION__" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=__MILKFLOW_VERSION__">
  <link rel="shortcut icon" href="favicon.ico?v=__MILKFLOW_VERSION__">
  <script>
    window.MILKFLOW_BUILD=Object.freeze({version:'__MILKFLOW_VERSION__',commit:'__MILKFLOW_COMMIT__'});
    (()=>{
      const root=document.documentElement,h=new Date().getHours();
      root.classList.add('mf-booting');
      root.dataset.daypart=h>=5&&h<12?'morning':h>=12&&h<17?'afternoon':h>=17&&h<21?'evening':'night';
      try{
        const state=JSON.parse(localStorage.getItem('milkflow-family-v4-state')||'{}');
        const pref=state?.ui?.theme||'auto';
        const dark=pref==='dark'||(pref==='auto'&&(root.dataset.daypart==='night'||matchMedia('(prefers-color-scheme: dark)').matches));
        root.dataset.theme=dark?'dark':'light';
        const rawExperience=localStorage.getItem('milkflow-experience-theme-v1');
        const experience=rawExperience==='jungle'||rawExperience==='storybook'?'safari':rawExperience;
        root.dataset.experienceTheme=['safari','butterfly','princess','unicorn','clean'].includes(experience)?experience:'safari';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#0e1016':'#f4f4f9');
      }catch{root.dataset.experienceTheme='safari';}
      const reveal=()=>requestAnimationFrame(()=>root.classList.remove('mf-booting'));
      window.addEventListener('DOMContentLoaded',()=>{
        const timeout=new Promise(resolve=>setTimeout(resolve,650));
        const fonts=document.fonts?.ready||Promise.resolve();
        Promise.race([fonts,timeout]).then(reveal,reveal);
      },{once:true});
    })();
  </script>
  <style>html.mf-booting .topbar,html.mf-booting #view,html.mf-booting #bottomNav{visibility:hidden}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=__MILKFLOW_VERSION__">
  <link rel="stylesheet" href="theme.css?v=__MILKFLOW_VERSION__">
  <link rel="stylesheet" href="doctor-summary.css?v=__MILKFLOW_VERSION__">
  <!-- The Firebase SDKs are NOT script tags any more. Deferred scripts execute in document
       order, so three ~100KB bundles from gstatic sitting above app.js meant the app could not
       render the data already on the device until all of them had arrived - which is the pause
       between opening the app and seeing today's numbers. app.js loads them on demand after
       the first render instead. The preconnect keeps that later fetch quick. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script src="config.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="app.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="cross-device-alerts.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="app-reliability.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="core-ui.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="experience-theme.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="render-lifecycle.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="plan-reliability.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="network-reliability.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="ai-coach-client.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="app-update-notice.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="family-chat.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="doctor-summary.js?v=__MILKFLOW_VERSION__" defer></script>
  <script src="release-info.js?v=__MILKFLOW_VERSION__" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l7.8-7.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></div><div><strong>MilkFlow</strong><span>Family care</span></div></div>
    <div id="sideNav" class="side-nav"></div>
    <div class="side-status"><strong id="syncTitle">On this device</strong><span id="syncSubtitle">Sign in to sync across devices</span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="back-btn" data-back aria-label="Back"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 18-6-6 6-6"/></svg><span id="backLabel"></span></button>
      <div class="title-wrap"><h1 id="pageTitle">Mom</h1></div>
      <div id="personaTabs" class="mobile-workspace" role="group" aria-label="Whose screen"><button data-workspace="mom">Mom</button><button data-workspace="baby">Baby</button></div>
    </header>
    <section id="view" class="view"></section>
    <footer id="syncFoot" class="sync-foot"></footer>
  </main>
</div>
<nav id="bottomNav" class="bottom-nav" aria-label="Primary navigation"></nav>
<div id="scrim" class="scrim"></div>
<div id="sheet" class="sheet"></div>
<dialog id="momDialog" class="dialog"><form id="momForm"><div class="dialog-body" id="momFormBody"></div></form></dialog>
<dialog id="diaperDialog" class="dialog baby-dialog"><form id="diaperForm"><div class="dialog-body" id="diaperFormBody"></div></form></dialog>
<dialog id="feedDialog" class="dialog baby-dialog"><form id="feedForm"><div class="dialog-body" id="feedFormBody"></div></form></dialog>
<dialog id="growthDialog" class="dialog baby-dialog"><form id="growthForm"><div class="dialog-body" id="growthFormBody"></div></form></dialog>
<dialog id="sleepDialog" class="dialog baby-dialog"><form id="sleepForm"><div class="dialog-body" id="sleepFormBody"></div></form></dialog>
<dialog id="authDialog" class="dialog">
  <form id="authForm">
    <div class="dialog-head"><h2>Family account</h2><button type="button" onclick="document.getElementById('authDialog').close()" aria-label="Close">×</button></div>
    <div class="auth-helper">Use one family account on every device. Signing in merges cloud and device history; it does not erase local records.</div>
    <div class="auth-fields"><label class="field"><span>Email</span><input id="authEmail" type="email" autocomplete="email" required></label><label class="field"><span>Password</span><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label></div>
    <div class="auth-actions"><button type="button" id="createAccount">Create account</button><button class="save">Sign in</button></div>
  </form>
</dialog>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<input id="photoFile" type="file" accept="image/*" class="hidden">
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
  if('serviceWorker'in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js?v=__MILKFLOW_VERSION__',{updateViaCache:'none'})
        .then(reg=>reg.update().catch(()=>{}))
        .catch(err=>console.warn('SW registration skipped',err));
    });
  }
</script>
</body>
</html>
