<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5fa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MilkFlow Family</title><link rel="manifest" href="manifest.webmanifest?v=12"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="app-v6.css?v=12">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script><script src="config.js?v=12" defer></script><script src="app-v6.js?v=12" defer></script></head><body>
<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l7.8-7.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></div><div><strong>MilkFlow</strong><small>Family care</small></div></div><div class="workspace-switch"><button data-workspace="mom">Mom</button><button data-workspace="baby">Baby</button></div><div class="nav-section">MOM</div><nav class="nav"><button class="nav-item" data-view="mom-home">♥ Home</button><button class="nav-item" data-view="today">◷ Today</button><button class="nav-item" data-view="history">≡ History</button><button class="nav-item" data-view="trends">⌁ Trends</button><button class="nav-item" data-view="stash">❄ Stash</button></nav><div class="nav-section">BABY</div><nav class="nav"><button class="nav-item" data-view="baby-home">● Home</button><button class="nav-item" data-view="baby-history">≡ History</button><button class="nav-item" data-view="doctor">✚ Doctor summary</button></nav><div class="nav-section">FAMILY</div><nav class="nav"><button class="nav-item" data-view="settings">⚙ Settings</button></nav><div class="sidebar-bottom"><div class="sync-card"><div class="sync-dot"></div><div><strong id="syncTitle">On this device</strong><span id="syncSubtitle">Sign in to sync</span></div></div></div></aside>
<main class="main"><header class="topbar"><button class="icon-btn" data-menu aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="topbar-title"><h1 id="viewTitle">Mom</h1></div><span class="cloud-badge off" id="cloudBadge">Device</span><div class="mobile-workspace"><button data-workspace="mom">Mom</button><button data-workspace="baby">Baby</button></div><div class="top-actions" id="topActions"></div></header><section class="content" id="content"></section></main></div>
<div class="scrim" id="scrim"></div>
<nav class="mobile-nav"><button data-mobile-tab="home"></button><button data-mobile-tab="history"></button><button class="add-tab" data-mobile-tab="add"></button><button data-mobile-tab="insights"></button><button data-mobile-tab="more"></button></nav>
<div class="bottom-sheet" id="quickSheet"></div><div class="bottom-sheet" id="moreSheet"></div>
<dialog id="entryDialog" class="dialog"><form id="entryForm"><div class="dialog-head"><h2 id="dialogTitle">Pump</h2><button type="button" class="icon-btn" onclick="document.getElementById('entryDialog').close()">×</button></div><input type="hidden" id="entryType" value="pump"><section class="entry-section"><div class="entry-section-title">Date & time</div><div class="picker-grid two"><label class="picker-field"><span>Date</span><input id="entryDate" type="date" required></label><label class="picker-field"><span>Time</span><input id="entryTime" type="time" required></label></div></section><section class="entry-section pump-only"><div class="entry-section-title">Milk</div><label class="picker-field"><span>Amount (mL)</span><input id="entryAmount" type="number" inputmode="decimal" min="0" max="1200" step="1" required></label></section><section class="entry-section"><div class="entry-section-title">Details</div><div class="picker-grid two"><label class="picker-field"><span>Minutes</span><input id="entryDuration" type="number" inputmode="numeric" min="0" max="180" step="1"></label><label class="picker-field nurse-only hidden"><span>Side</span><select id="entrySide"><option value="right">Right</option><option value="left">Left</option><option value="both">Both</option></select></label><label class="picker-field pump-only"><span>Type</span><select id="entryQuality"><option value="normal">Regular</option><option value="short">Short</option><option value="power">Power pump</option></select></label></div><details class="optional-note"><summary>Add note</summary><textarea id="entryNote" rows="2"></textarea></details></section><div class="dialog-actions"><button type="button" class="btn ghost" onclick="document.getElementById('entryDialog').close()">Cancel</button><button class="btn primary">Save</button></div></form></dialog>
<dialog id="babyDialog" class="dialog"><form id="babyForm"><div class="dialog-head"><h2 id="babyDialogTitle">Baby care</h2><button type="button" class="icon-btn" onclick="document.getElementById('babyDialog').close()">×</button></div><input type="hidden" id="babyEventType" value="diaper"><section class="entry-section"><div class="entry-section-title">Date & time</div><div class="picker-grid two"><label class="picker-field"><span>Date</span><input id="babyDate" type="date" required></label><label class="picker-field"><span>Time</span><input id="babyTime" type="time" required></label></div></section><section class="entry-section"><div class="entry-section-title">Details</div><div class="picker-grid two"><label class="picker-field"><span>Type</span><select id="babySubtype"><option value="wet">Wet</option><option value="poop">Poop</option><option value="both">Wet + poop</option></select></label><label class="picker-field hidden" id="babyAmountWrap"><span>Bottle (oz)</span><input id="babyAmount" type="number" inputmode="decimal" min="0" max="20" step="0.1"></label></div><details class="optional-note"><summary>Add note</summary><textarea id="babyNote" rows="2"></textarea></details></section><div class="dialog-actions"><button type="button" class="btn ghost" onclick="document.getElementById('babyDialog').close()">Cancel</button><button class="btn primary">Save</button></div></form></dialog>
<dialog id="authDialog" class="dialog small-dialog"><form id="authForm"><div class="dialog-head"><h2>Family sign in</h2><button type="button" class="icon-btn" onclick="document.getElementById('authDialog').close()">×</button></div><div class="auth-helper">Use the same family account on every device.</div><label>Email<input id="authEmail" type="email" autocomplete="email" required></label><label>Password<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label><div class="auth-actions"><button type="button" class="btn ghost" id="signUpBtn">Create account</button><button class="btn primary">Sign in</button></div></form></dialog>
<input type="file" id="importFile" accept="application/json,.json" class="hidden"><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>if('serviceWorker'in navigator){window.addEventListener('load',async()=>{const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));navigator.serviceWorker.register('./sw.js?v=12').catch(()=>{});});}</script></body></html>
